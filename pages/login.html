<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="shortcut icon" href="/assets/images/index/favicon.ico" type="image/x-icon">
  <title>FineDine | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="/assets/css/login.css"/>
</head>
<body>

  <div id="login-card">
    <a href="/index.html" id="login-logo">
        <img src="/assets/images/index/logo.png" alt="FineDine logo" /> Fine<span>Dine</span> </a>
    <p id="login-tagline">Welcome back. Sign in to continue.</p>

    <div class="input-wrap">
      <i class="fas fa-user"></i>
      <input type="text" placeholder="Username" />
    </div>

    <div class="input-wrap">
      <i class="fas fa-lock"></i>
      <input type="password" placeholder="Password" />
    </div>

    <a href="/index.html" id="forgot">Forgot Password?</a>

    <a href="/index.html" id="login-btn">Login</a>

    <p id="signup-link">Don't have an account? <a href="/pages/signup.html">Sign Up</a></p>

  </div>

</body>
</html>
