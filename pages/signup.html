<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FineDine | Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../assets/css/signup.css"/>
</head>
<body>

  <div id="signup-card">

    <a href="../index.html" id="signup-logo">
      <img src="../assets/images/index/logo.png" alt="FineDine logo" />
      Fine<span>Dine</span>
    </a>
    <p id="signup-tagline">Create your account and start ordering.</p>

    <div class="input-wrap">
      <i class="fas fa-user"></i>
      <input type="text" placeholder="Full Name"/>
    </div>

    <div class="input-wrap">
      <i class="fas fa-envelope"></i>
      <input type="email" placeholder="Email Address" />
    </div>

    <div class="input-wrap">
      <i class="fas fa-lock"></i>
      <input type="password" placeholder="Password" />
    </div>

    <div class="input-wrap">
      <i class="fas fa-lock"></i>
      <input type="password" placeholder="Confirm Password" />
    </div>

    <a href="login.html" id="signup-btn">Create Account</a>

    <p id="login-link">Already have an account? <a href="login.html">Log In</a></p>

  </div>

</body>
</html>
