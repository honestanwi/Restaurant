<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Reviews</title>
<link rel="stylesheet" href="c:\Users\Brenda\Desktop\Restaurant\assets\css\review.css">
</head>

<body>

<h1>Customer Reviews</h1>

<div class="review-container">

<!-- Review Form -->

<form class="review-form">

<label>Your Name</label>
<input type="text" placeholder="Enter your name" required>

<label>Your Review</label>
<textarea placeholder="Write your review..." required></textarea>

<label>Rating</label>
<select>
<option>⭐⭐⭐⭐⭐ Excellent</option>
<option>⭐⭐⭐⭐ Good</option>
<option>⭐⭐⭐ Average</option>
<option>⭐⭐ Poor</option>
<option>⭐ Bad</option>
</select>

<button type="submit">Submit Review</button>

</form>

</div>

<!-- Example Reviews -->

<div class="reviews">

<div class="review-box">
<h3>John</h3>
<p>⭐⭐⭐⭐⭐</p>
<p>Amazing food and great service!</p>
</div>

<div class="review-box">
<h3>Sarah</h3>
<p>⭐⭐⭐⭐</p>
<p>Beautiful restaurant and delicious meals.</p>
</div>

</div>

</body>
</html>
